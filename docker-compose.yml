# Grade Limited — full stack: the Astro site, Directus, and Postgres.
#
#   cp .env.example .env      # then edit the secrets
#   docker compose up -d --build
#
# On a VPS the same command applies. nginx is NOT containerised: it runs on the
# host and proxies to 127.0.0.1:4321 — install nginx/gradebd.conf into
# /etc/nginx/sites-enabled/. See docs/deploy-vps.md.
#
#   site      → http://localhost:4321
#   Directus  → http://localhost:8055
#
# The site is usable on its own (`docker compose up -d site`) because content
# falls back to the seed JSON when DIRECTUS_URL is unset.

services:
  site:
    build:
      context: .
      args:
        # Canonical URL baked into <link rel=canonical> and the sitemap.
        SITE_URL: ${SITE_URL:-http://localhost:4321}
    image: gradebd-site:latest
    restart: unless-stopped
    # Bound to loopback: on the VPS the host's nginx is the only public listener
    # and reaches the site here, and locally http://localhost:4321 still works.
    ports:
      - '127.0.0.1:${SITE_PORT:-4321}:4321'
    environment:
      # Server-side reads go over the compose network; leave empty to use seed JSON.
      # Read at RUN time, not baked into the image — one image, any environment.
      DIRECTUS_URL: ${DIRECTUS_INTERNAL_URL:-}
      # The admin's public origin. Only in-place editing uses it: images are
      # proxied through the site at /cms/<id>, so this is not an asset host.
      DIRECTUS_PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-}
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN:-}
      # Seconds to hold a Directus response. 0 keeps in-place editing honest —
      # a moderator's save shows on the next reload.
      DIRECTUS_CACHE_TTL: ${DIRECTUS_CACHE_TTL:-0}
    depends_on:
      directus:
        condition: service_started

  directus:
    image: directus/directus:11
    restart: unless-stopped
    # Loopback only. The admin app is not exposed to the internet by default;
    # reach it with `ssh -L 8055:127.0.0.1:8055 user@vps`, or add a server block
    # for it to the host's nginx — see docs/deploy-vps.md.
    ports:
      - '127.0.0.1:${DIRECTUS_PORT:-8055}:8055'
    volumes:
      # Uploaded images and extensions must outlive the container.
      - directus-uploads:/directus/uploads
      - directus-extensions:/directus/extensions
    environment:
      # Both are required and must be stable — regenerating them invalidates
      # every existing session and all encrypted values.
      KEY: ${DIRECTUS_KEY:?set DIRECTUS_KEY in .env}
      SECRET: ${DIRECTUS_SECRET:?set DIRECTUS_SECRET in .env}

      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-gradebd}
      DB_USER: ${POSTGRES_USER:-gradebd}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

      # First-run admin. Change the password after the first login.
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-sales@gradebd.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?set DIRECTUS_ADMIN_PASSWORD in .env}

      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-http://localhost:8055}

      # The Visual Editor loads the *site* inside the admin app, so Directus'
      # own CSP has to allow it. frame-src falls back to default-src ('self'),
      # which silently leaves the editor showing a blank panel — this is the one
      # setting that makes in-place editing work at all.
      CONTENT_SECURITY_POLICY_DIRECTIVES__FRAME_SRC: ${SITE_URL:-http://localhost:4321}
      # And the reverse direction, for embedding Directus in the site.
      CONTENT_SECURITY_POLICY_DIRECTIVES__FRAME_ANCESTORS: ${SITE_URL:-http://localhost:4321}
      CORS_ENABLED: 'true'
      CORS_ORIGIN: ${SITE_URL:-http://localhost:4321}

      # Enquiry notifications. Directus sends these from a Flow on the
      # `enquiries` collection; without SMTP configured it logs instead of sending.
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-sendmail}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@gradebd.com}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_SECURE: ${EMAIL_SMTP_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Not published: only Directus needs it. Add a ports mapping if you want to
    # connect a local client, and understand you are exposing the database.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gradebd}
      POSTGRES_USER: ${POSTGRES_USER:-gradebd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      # Directus crashes on a database that isn't accepting connections yet.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gradebd} -d ${POSTGRES_DB:-gradebd}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  directus-uploads:
  directus-extensions:
