# Grade Limited — nginx site config for the VPS.
#
# This is a plain host nginx config. Nothing here runs in Docker; the container
# only listens on 127.0.0.1:4321 and nginx on the host proxies to it.
#
#   sudo cp nginx/gradebd.conf /etc/nginx/sites-available/gradebd.conf
#   sudo ln -s /etc/nginx/sites-available/gradebd.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue the certificate — certbot edits THIS FILE in place, adding the 443
# server, the certificate paths and an 80 -> 443 redirect:
#
#   sudo certbot --nginx -d gradebd.com -d www.gradebd.com
#
# After that, copying this file over again would wipe certbot's edits. Edit the
# installed copy from then on, or re-run certbot after replacing it.
#
# See docs/deploy-vps.md for the full runbook.

server {
    listen      80;
    listen [::]:80;
    server_name gradebd.com www.gradebd.com;

    access_log /var/log/nginx/gradebd.access.log;
    error_log  /var/log/nginx/gradebd.error.log warn;

    # The only request body the site takes is the enquiry form's JSON.
    client_max_body_size 1m;

    # Set here rather than relying on the host's http block: Debian ships
    # `gzip on` with gzip_types commented out, which leaves the default of
    # text/html — so CSS and JS would go over the wire uncompressed.
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/manifest+json
        image/svg+xml font/ttf font/otf;

    # `always` so they survive error responses too. No X-Frame-Options: Directus
    # Visual Editor loads the site in an iframe from the CMS origin and SAMEORIGIN
    # would block it. To control framing, use frame-ancestors instead:
    #   add_header Content-Security-Policy "frame-ancestors 'self' https://cms.gradebd.com" always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    # Enable after certbot has run and HTTPS is confirmed working. Two years,
    # without `preload` — getting onto the browser preload list is very hard to undo.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ── proxy defaults, inherited by every location below ────────────────────
    # docker-compose.yml publishes the site container on loopback only, so this
    # proxy is the sole way in.
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";      # keepalive to the container
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    # Deliberately NOT $proxy_add_x_forwarded_for. The Astro node adapter reads
    # the FIRST value of X-Forwarded-For as the client address, so appending would
    # let a caller prepend a fake IP and walk past the enquiry rate limit. nginx is
    # the edge, so it is the only thing allowed to write this header.
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   X-Forwarded-Port  $server_port;
    proxy_redirect     off;

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ── the enquiry endpoint ─────────────────────────────────────────────────
    # The only non-prerendered route. The app rate-limits it too, but that limiter
    # is in-memory and per-instance, so it dies with the container.
    #
    # To limit here as well, add the zone to the http block — it cannot live in a
    # server block, which is why it is not switched on by default:
    #
    #   echo 'limit_req_zone $binary_remote_addr zone=enquiry:10m rate=6r/m;' \
    #     | sudo tee /etc/nginx/conf.d/gradebd-limits.conf
    #
    # then uncomment the two lines below and reload.
    location = /api/enquiry {
        # limit_req        zone=enquiry burst=3 nodelay;
        # limit_req_status 429;
        proxy_pass http://127.0.0.1:4321;
    }

    # ── static assets ────────────────────────────────────────────────────────
    # Astro already marks /_astro/* immutable — those filenames are hashed. Files
    # copied verbatim from public/ are not, so they get a month rather than a year:
    # long enough to matter, short enough that a replaced product photo appears
    # without needing a new filename.
    location ~* ^/(images|fonts)/ {
        proxy_pass http://127.0.0.1:4321;

        proxy_hide_header Cache-Control;
        # No `always`: a 404 for a missing asset must not be cached for a month.
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ── everything else ──────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:4321;
    }
}

# ── apex -> www ──────────────────────────────────────────────────────────────
# SITE_URL bakes https://www.gradebd.com into <link rel="canonical"> and the
# sitemap, so www is canonical and the apex should redirect to it. Serving both
# is what the block above does today, which means two URLs for every page.
#
# To switch: after certbot has run, remove `gradebd.com` from the server_name of
# the 443 block it created, and add this alongside it — reusing the certificate
# certbot installed, since it already covers both names.
#
# server {
#     listen      443 ssl;
#     listen [::]:443 ssl;
#     server_name gradebd.com;
#
#     ssl_certificate     /etc/letsencrypt/live/gradebd.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/gradebd.com/privkey.pem;
#     include /etc/letsencrypt/options-ssl-nginx.conf;
#     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
#
#     return 301 https://www.gradebd.com$request_uri;
# }
