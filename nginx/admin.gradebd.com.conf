# Directus admin — admin.gradebd.com
#
# The CMS. Directus runs in Docker on 127.0.0.1:8055 and this puts it on a
# hostname with a certificate, which the Visual Editor needs: it loads the live
# website inside the admin, and a browser will not mix an https page with an
# http frame.
#
#   sudo cp nginx/admin.gradebd.com.conf /etc/nginx/sites-available/admin.gradebd.com.conf
#   sudo ln -s /etc/nginx/sites-available/admin.gradebd.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d admin.gradebd.com
#
# certbot rewrites this file in place, adding the 443 server and the redirect.
# Point an A record for admin.gradebd.com at the box first, or the challenge fails.
#
# Set these in .env before bringing the stack up, or Directus will write its own
# URLs wrong and the editor will not connect:
#
#   DIRECTUS_PUBLIC_URL=https://admin.gradebd.com
#   SITE_URL=https://www.gradebd.com
#
# This is an admin surface. If it does not need to be public, do not publish it
# at all — reach it over `ssh -L 8055:127.0.0.1:8055 user@vps` instead. The
# Visual Editor is the one feature that genuinely needs a public hostname.

server {
    listen      80;
    listen [::]:80;
    server_name admin.gradebd.com;

    access_log /var/log/nginx/gradebd-admin.access.log;
    error_log  /var/log/nginx/gradebd-admin.error.log warn;

    # Moderators upload product photography through here, so the 1m the website
    # uses would reject a pack shot.
    client_max_body_size 100m;

    # Uploads and large image transforms outlast a 60s read.
    proxy_connect_timeout 5s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   X-Forwarded-Port  $server_port;
    proxy_redirect     off;

    # No security headers are added here on purpose. Directus sends its own
    # Content-Security-Policy, including the frame-src that lets the Visual
    # Editor embed the website; a second, stricter header at the edge would win
    # and leave the editor showing an empty panel with no obvious cause.

    # Directus realtime. The shared proxy defaults above blank Connection for
    # keepalive, so both headers are set again here.
    location /websocket {
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_pass http://127.0.0.1:8055;
    }

    location / {
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:8055;
    }

    # ── restricting access ───────────────────────────────────────────────────
    # Optional, and worth doing once the office IP is known. Uncomment, put the
    # real addresses in, and everyone else gets a 403 before Directus is touched.
    #
    # location = /admin {
    #     allow 203.0.113.4;      # office
    #     allow 198.51.100.7;     # someone working from home
    #     deny all;
    #     proxy_pass http://127.0.0.1:8055;
    # }
}
