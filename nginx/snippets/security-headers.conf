# Response headers applied to the site. `always` so they survive error responses.
#
# Note: no X-Frame-Options. Directus Visual Editor loads the site in an iframe
# from the CMS origin, and SAMEORIGIN would block it. Control framing with
# frame-ancestors instead — uncomment and name the CMS origin once it is live:
#
#   add_header Content-Security-Policy "frame-ancestors 'self' https://cms.gradebd.com" always;

add_header X-Content-Type-Options "nosniff"                        always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
