# Shared TLS parameters. Included by the 443 server blocks; the certificate
# paths themselves stay in the server block, because they are per-hostname.

ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
# ECDHE only. nginx has shipped no built-in DH group since 1.11, so DHE suites
# would need an ssl_dhparam file to work at all — and nothing that can reach
# this site lacks ECDHE.
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_cache    shared:TLS:10m;
ssl_session_timeout  1d;
ssl_session_tickets  off;

# No ssl_stapling. Let's Encrypt retired OCSP in 2025 and no longer puts a
# responder URL in the certificate, so enabling stapling does nothing except
# log "ssl_stapling ignored" on every start. If you move to a CA that still
# issues OCSP URLs, add `ssl_stapling on; ssl_stapling_verify on;` here and
# point ssl_trusted_certificate at the issuer chain in the server block.
