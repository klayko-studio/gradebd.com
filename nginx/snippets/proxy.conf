# Shared proxy headers. Included by every location that hands off to a container.

proxy_http_version 1.1;
# Empty Connection header + HTTP/1.1 keeps the upstream connection reusable.
proxy_set_header Connection        "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# Deliberately NOT $proxy_add_x_forwarded_for. The Astro node adapter takes the
# *first* value of X-Forwarded-For as the client address, and appending would let
# a caller prepend their own value and walk straight past the app's rate limit.
# nginx is the edge here, so it is the only thing allowed to write this header.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

proxy_redirect off;
proxy_buffering on;

# Timeouts are deliberately NOT set here. This snippet is included inside
# locations, and nginx rejects a directive declared twice in one context — so a
# location that needs a longer read timeout (Directus uploads, websockets) could
# not override it. They are set at server level instead, where locations inherit
# them and can override cleanly.
