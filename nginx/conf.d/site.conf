# ── Grade Limited · HTTP only ────────────────────────────────────────────────
# The starting state: serves the site on port 80 and answers the ACME
# http-01 challenge so certbot can issue a certificate.
#
# Once you hold a certificate, swap this file out for the TLS pair:
#
#   mv nginx/conf.d/site.conf              nginx/conf.d/site.conf.disabled
#   mv nginx/conf.d/site-tls.conf.disabled nginx/conf.d/site-tls.conf
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#       exec nginx nginx -t && … exec nginx nginx -s reload
#
# Only files ending in .conf are loaded, which is what makes the .disabled
# suffix the on/off switch.

server {
    # default_server so the first deploy is reachable by bare IP, before DNS
    # has propagated. The TLS config replaces this with a Host-matching block
    # and drops unknown-Host traffic.
    listen      80 default_server;
    listen [::]:80 default_server;
    server_name gradebd.com www.gradebd.com _;

    # Docker DNS is re-resolved per request via this variable, so `up -d --build`
    # on the site container does not require an nginx restart.
    set $site http://site:4321;

    limit_conn perip 24;

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    include /etc/nginx/snippets/security-headers.conf;

    # ── ACME http-01 ─────────────────────────────────────────────────────────
    # ^~ so no regex location can steal it. Must stay reachable over plain HTTP
    # for renewals as well as the first issuance.
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/certbot;
        default_type "text/plain";
        access_log   off;
    }

    # ── the enquiry endpoint ─────────────────────────────────────────────────
    # The only non-prerendered route. Limited here as well as in the app,
    # because the app's limiter is in-memory and per-instance.
    location = /api/enquiry {
        limit_req zone=enquiry burst=3 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $site$request_uri;
    }

    # ── fingerprinted build output ───────────────────────────────────────────
    # Astro's node server already marks /_astro/* immutable; nothing to add.
    # Files copied verbatim from public/ are not fingerprinted, so they get a
    # month rather than a year — long enough to matter, short enough that a
    # replaced product photo appears without a filename change.
    location ~* ^/(images|fonts)/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $site$request_uri;

        proxy_hide_header Cache-Control;
        # No `always`: a 404 or 502 for a missing asset must not be cached for a
        # month. Without it nginx applies the header to 2xx/3xx only.
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # ── everything else ──────────────────────────────────────────────────────
    location / {
        limit_req zone=browse burst=80 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $site$request_uri;
    }
}
