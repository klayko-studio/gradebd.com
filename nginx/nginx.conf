# Grade Limited — nginx edge config.
#
# Mounted over /etc/nginx/nginx.conf in the `nginx` service of
# docker-compose.prod.yml. Everything site-specific lives in conf.d/.

user  nginx;
worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $host, not $http_host, so the log shows what nginx actually matched.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time us=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Don't advertise the version in responses or error pages.
    server_tokens off;

    # The only request body the site takes is the enquiry JSON.
    client_max_body_size  1m;
    client_body_timeout   15s;
    client_header_timeout 15s;

    # Docker's embedded DNS. Upstreams are referenced through variables and
    # resolved per-request, so recreating the site container (`up -d --build`)
    # does not leave nginx 502-ing against a dead IP until it is restarted.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    # gzip. The stock nginx image has no brotli module; if you want brotli,
    # build an image with ngx_brotli rather than assuming this covers it.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   512;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/manifest+json
        image/svg+xml font/ttf font/otf;

    # ── rate limits ───────────────────────────────────────────────────────────
    # The app has its own 5-per-10-minutes-per-IP limit on /api/enquiry, but that
    # is in-memory and per-instance. This is the limit that actually protects it.
    limit_req_zone $binary_remote_addr zone=enquiry:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=browse:10m  rate=40r/s;
    limit_req_status 429;

    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_status 429;

    # WebSocket upgrade passthrough. Only the Directus realtime endpoint needs
    # it; the site itself has no sockets. Empty value for a normal request, so a
    # location can include this without breaking keepalive.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    include /etc/nginx/conf.d/*.conf;
}
